name: CI - Pipeline MLOps Forage

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # Récupération du code source du dépôt
    - name: Checkout du code
      uses: actions/checkout@v4

    # Configuration de l'environnement Python
    - name: Configuration de Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
        cache: 'pip'

    # Installation des dépendances du projet
    - name: Installer les dépendances
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # Exécution du script d'entraînement (génère le modèle et les métadonnées)
    - name: Lancer l'entraînement du modèle
      run: |
        python -m src.entrainement

    # Tests + garde-fou de performance : la CI échoue si le modèle
    #    passe sous les seuils (PR-AUC 0,55, rappel 0,85, précision 0,35)
    - name: Tests et garde-fou de performance
      run: python -m pytest tests -v

    # Test du build de l'image Docker pour s'assurer qu'elle se compile bien
    - name: Tester la construction de l'image Docker
      run: |
        docker build -t panne-forage-api:test .
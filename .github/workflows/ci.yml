name: CI - Pipeline MLOps Forage

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # 1. Récupération du code source du dépôt
    - name: Checkout du code
      uses: actions/checkout@v4

    # 2. Configuration de l'environnement Python
    - name: Configuration de Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
        cache: 'pip'

    # 3. Installation des dépendances du projet
    - name: Installer les dépendances
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4. Exécution du script d'entraînement (génère le modèle et les métadonnées)
    - name: Lancer l'entraînement du modèle
      run: |
        python -m src.entrainement

    # 5. Test du build de l'image Docker pour s'assurer qu'elle se compile bien
    - name: Tester la construction de l'image Docker
      run: |
        docker build -t panne-forage-api:test .